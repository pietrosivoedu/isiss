<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar Istituto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; margin: 0; }
        .prodotto { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .info p { margin: 0; color: #888; font-size: 14px; }
        .controlli { display: flex; align-items: center; gap: 10px; }
        button { background: #007aff; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 18px; cursor: pointer; }
        .qta { font-weight: bold; width: 20px; text-align: center; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Menu Bar</h2>

    <div class="prodotto">
        <div class="info"><h3>Panino Cotto</h3><p>€ 2.50</p></div>
        <div class="controlli"><button onclick="modifica('Panino Cotto', -1)">-</button><span class="qta" id="qta-Panino Cotto">0</span><button onclick="modifica('Panino Cotto', 1)">+</button></div>
    </div>
    <div class="prodotto">
        <div class="info"><h3>Acqua Frizzante</h3><p>€ 1.00</p></div>
        <div class="controlli"><button onclick="modifica('Acqua Frizzante', -1)">-</button><span class="qta" id="qta-Acqua Frizzante">0</span><button onclick="modifica('Acqua Frizzante', 1)">+</button></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setText("INVIA ORDINE");
        tg.MainButton.color = "#31b545";

        let carrello = {};

        function modifica(nome, valore) {
            if (!carrello[nome]) carrello[nome] = 0;
            carrello[nome] += valore;
            if (carrello[nome] < 0) carrello[nome] = 0;
            
            document.getElementById('qta-' + nome).innerText = carrello[nome];
            
            let totalePezzi = 0;
            let stringaOrdine = "";
            for (let item in carrello) {
                if (carrello[item] > 0) {
                    totalePezzi += carrello[item];
                    stringaOrdine += `${carrello[item]}x ${item}, `; 
                }
            }

            if (totalePezzi > 0) tg.MainButton.show();
            else tg.MainButton.hide();

            window.ordineFinale = stringaOrdine.slice(0, -2);
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            tg.sendData(window.ordineFinale);
            tg.close();
        });
    </script>
</body>
</html>
