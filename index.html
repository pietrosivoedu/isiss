<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar Istituto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; padding-bottom: 120px; margin: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        .sezione-dati { background: var(--tg-theme-secondary-bg-color, #f0f0f0); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .categoria { font-size: 18px; margin-top: 25px; margin-bottom: 10px; border-bottom: 2px solid #007aff; padding-bottom: 5px; font-weight: bold; }
        .prodotto { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .info p { margin: 0; color: #888; font-size: 14px; }
        .controlli { display: flex; align-items: center; gap: 10px; }
        
        button.btn-qta { 
            background: #007aff; color: white; border: none; border-radius: 50%; 
            width: 32px; height: 32px; font-size: 20px; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
        }
        
        .qta { font-weight: bold; width: 24px; text-align: center; font-size: 16px; }
        .barra-totale-pagina { position: fixed; bottom: 0; left: 0; right: 0; background: #007aff; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; box-shadow: 0 -3px 10px rgba(0,0,0,0.2); z-index: 999; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-top: 0;">Menu Bar ISISS</h2>
    
    <div class="sezione-dati">
        <div class="form-group">
            <label for="classe">Classe / Ufficio:</label>
            <input type="text" id="classe" placeholder="es. 2BENO o 3A Info">
        </div>
        <div class="form-group">
            <label for="note">Note:</label>
            <textarea id="note" rows="2" placeholder="Note per la preparazione..."></textarea>
        </div>
    </div>
    
    <div id="lista-prodotti"></div>

    <div id="totale-pagina" class="barra-totale-pagina" style="display: none;">
        Totale Ordine: € 0.00
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.color = "#31b545";

        const listino = [
            { categoria: "Panini e Caldi", nome: "Panino Prosciutto crudo", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Panino Prosciutto crudo e formaggio", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Panino Salame", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Panino Salame e formaggio", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Panino Prosciutto cotto", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Panino Prosciutto cotto e formaggio", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Panino Mortadella", prezzo: 1.5 },
            { categoria: "Panini e Caldi", nome: "Hot dog surgelato", prezzo: 2 },
            { categoria: "Panini e Caldi", nome: "Panino napoletano surgelato", prezzo: 2 },
            { categoria: "Panini e Caldi", nome: "Calzone mozzarella e pomodoro surgelato", prezzo: 2.2 },
            
            { categoria: "Caffetteria", nome: "Caffè", prezzo: 1 },
            { categoria: "Caffetteria", nome: "Cappuccino", prezzo: 1.2 },
            { categoria: "Caffetteria", nome: "Camomilla", prezzo: 0.8 },
            { categoria: "Caffetteria", nome: "Ginseng", prezzo: 1 },
            { categoria: "Caffetteria", nome: "Caffè orzo", prezzo: 1 },
            { categoria: "Caffetteria", nome: "Tè caldo", prezzo: 0.8 },
            { categoria: "Caffetteria", nome: "Tisane", prezzo: 0.8 },
            { categoria: "Caffetteria", nome: "Cornetti vari", prezzo: 1.2 },
            { categoria: "Caffetteria", nome: "Cornetti integrale", prezzo: 1.5 },
            { categoria: "Caffetteria", nome: "Conchiglia", prezzo: 1.2 },
            
            { categoria: "Bevande", nome: "Acqua naturale 50cl", prezzo: 0.5 },
            { categoria: "Bevande", nome: "Acqua gassata 50cl", prezzo: 0.5 },
            { categoria: "Bevande", nome: "Coca Cola 33cl", prezzo: 1.5 },
            { categoria: "Bevande", nome: "Pepsi 33cl", prezzo: 1 },
            { categoria: "Bevande", nome: "Estathé pesca o limone 33cl", prezzo: 1.5 },
            { categoria: "Bevande", nome: "Fanta aranciata 33cl", prezzo: 1.2 },
            { categoria: "Bevande", nome: "Succo di frutta Brik pesca o ace o albicocca 200 ml", prezzo: 0.7 },
            { categoria: "Bevande", nome: "San Ben. succoso varie gusti 40 cl", prezzo: 1.2 },
            { categoria: "Bevande", nome: "Energade", prezzo: 1.2 },
            
            { categoria: "Snack Salati", nome: "Pic Nic 50gr", prezzo: 1.2 },
            { categoria: "Snack Salati", nome: "Nic Nac’s 125 gr", prezzo: 3 },
            { categoria: "Snack Salati", nome: "Crackers TUC 31 gr", prezzo: 0.5 },
            { categoria: "Snack Salati", nome: "Croccantelle pizza o bacon o pizza", prezzo: 0.5 },
            { categoria: "Snack Salati", nome: "Krit tubo 100 gr", prezzo: 1.2 },
            { categoria: "Snack Salati", nome: "Crackers Granpavesi", prezzo: 0.5 },
            { categoria: "Snack Salati", nome: "Patatine San Carlo varie gusti", prezzo: 1.5 },
            { categoria: "Snack Salati", nome: "Patatine Amica varie gusti", prezzo: 1.5 },
            { categoria: "Snack Salati", nome: "Fonzies 40 gr", prezzo: 1.5 },
            
            { categoria: "Snack Dolci", nome: "Kinder Bueno classico o white", prezzo: 1.8 },
            { categoria: "Snack Dolci", nome: "Kinder Cereali", prezzo: 1 },
            { categoria: "Snack Dolci", nome: "Kit Kat classico o dark", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Lion", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Twix", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Bounty", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Mars", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Snickers", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Barretta Milka varie gusti", prezzo: 1.3 },
            { categoria: "Snack Dolci", nome: "M & M varie gusti", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Ringo cacao o vaniglia 55gr", prezzo: 1 },
            { categoria: "Snack Dolci", nome: "Baiocchi cacao o pistacchio 28gr", prezzo: 0.8 },
            { categoria: "Snack Dolci", nome: "Pavesini monodose", prezzo: 0.8 },
            { categoria: "Snack Dolci", nome: "Wafer varie gusti 45gr", prezzo: 1 },
            { categoria: "Snack Dolci", nome: "Biscotti Lotus 250gr", prezzo: 2.5 },
            { categoria: "Snack Dolci", nome: "Biscotti Oreo 66 gr", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Gomme Air Action", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Gomme Vigorsol con zucchero e senza", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Gomme Vigorsol frutta", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Gomme Air Action monoporzione", prezzo: 0.2 },
            { categoria: "Snack Dolci", nome: "Fruit Joy", prezzo: 1.2 },
            { categoria: "Snack Dolci", nome: "Golia Activ Plus", prezzo: 1.7 },
            { categoria: "Snack Dolci", nome: "Goleador", prezzo: 0.2 },
            { categoria: "Snack Dolci", nome: "Caramelle gommose hamburger", prezzo: 0.4 },
            { categoria: "Snack Dolci", nome: "Lupo Alberto", prezzo: 0.2 },
            { categoria: "Snack Dolci", nome: "Halls varie gusti", prezzo: 1 },
            { categoria: "Snack Dolci", nome: "Hot Dog Trolly caramelle gommose", prezzo: 0.5 }
        ];

        let quantita = new Array(listino.length).fill(0);
        let container = document.getElementById("lista-prodotti");
        let htmlRender = "";
        let categoriaAttuale = "";

        listino.forEach((item, index) => {
            if (item.categoria !== categoriaAttuale) {
                htmlRender += `<h3 class="categoria">${item.categoria}</h3>`;
                categoriaAttuale = item.categoria;
            }
            htmlRender += `
                <div class="prodotto">
                    <div class="info">
                        <h3>${item.nome}</h3>
                        <p>€ ${item.prezzo.toFixed(2)}</p>
                    </div>
                    <div class="controlli">
                        <button class="btn-qta" onclick="modifica(${index}, -1)">-</button>
                        <span class="qta" id="qta-${index}">0</span>
                        <button class="btn-qta" onclick="modifica(${index}, 1)">+</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = htmlRender;

        let totaleEuro = 0;
        let arrayCarrello = [];

        function modifica(index, valore) {
            quantita[index] += valore;
            if (quantita[index] < 0) quantita[index] = 0;
            
            document.getElementById('qta-' + index).innerText = quantita[index];
            calcolaTotale();
        }

        function calcolaTotale() {
            let totalePezzi = 0;
            totaleEuro = 0;
            arrayCarrello = [];
            
            listino.forEach((item, index) => {
                let qtaProdotto = quantita[index];
                if (qtaProdotto > 0) {
                    totalePezzi += qtaProdotto;
                    let totaleRiga = Math.round((qtaProdotto * item.prezzo) * 100) / 100;
                    totaleEuro += totaleRiga;
                    
                    arrayCarrello.push({
                        nome: item.nome,
                        prezzo: item.prezzo,
                        qta: qtaProdotto,
                        totale_riga: totaleRiga
                    });
                }
            });

            totaleEuro = Math.round(totaleEuro * 100) / 100;

            let divTotalePagina = document.getElementById("totale-pagina");
            
            if (totalePezzi > 0) {
                // Aggiornamento immediato della barra blu interna
                divTotalePagina.innerText = `Totale Ordine: € ${totaleEuro.toFixed(2)}`;
                divTotalePagina.style.display = "block";
                
                // Modifica asincrona con micro-ritardo per allineare il bridge nativo di Telegram
                setTimeout(() => {
                    tg.MainButton.setParams({
                        text: `INVIA ORDINE (€ ${totaleEuro.toFixed(2)})`,
                        is_visible: true
                    });
                }, 50);
            } else {
                divTotalePagina.style.display = "none";
                tg.MainButton.hide();
            }
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            let payload = {
                classe: document.getElementById('classe').value,
                note: document.getElementById('note').value,
                prodotti: arrayCarrello,
                totale_generale: totaleEuro
            };
            tg.sendData(JSON.stringify(payload));
            tg.close();
        });
    </script>
</body>
</html>
