<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar Istituto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; padding-bottom: 80px; margin: 0; }
        .categoria { font-size: 18px; margin-top: 25px; margin-bottom: 10px; border-bottom: 2px solid #007aff; padding-bottom: 5px; color: var(--tg-theme-text-color, #000000); }
        .prodotto { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .info p { margin: 0; color: #888; font-size: 14px; }
        .controlli { display: flex; align-items: center; gap: 10px; }
        button { background: #007aff; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .qta { font-weight: bold; width: 20px; text-align: center; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-top: 0;">Menu Bar</h2>
    
    <div id="lista-prodotti"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.color = "#31b545";

        // ==============================================================
        // IL TUO LISTINO: Aggiungi, rimuovi o modifica i prodotti qui!
        // ==============================================================
        const listino = [
            { categoria: "Panini", nome: "Panino Crudo", prezzo: 2.50 },
            { categoria: "Panini", nome: "Panino Cotto", prezzo: 2.00 },
            { categoria: "Panini", nome: "Panino Salame", prezzo: 2.00 },
            { categoria: "Pezzi Dolci", nome: "Cornetto Vuoto", prezzo: 1.20 },
            { categoria: "Pezzi Dolci", nome: "Cornetto Crema", prezzo: 1.50 },
            { categoria: "Pezzi Dolci", nome: "Cornetto Cioccolato", prezzo: 1.50 },
            { categoria: "Bevande", nome: "Acqua Naturale 0.5L", prezzo: 1.00 },
            { categoria: "Bevande", nome: "Acqua Frizzante 0.5L", prezzo: 1.00 },
            { categoria: "Bevande", nome: "Estathè Limone", prezzo: 2.00 },
            { categoria: "Bevande", nome: "Estathè Pesca", prezzo: 2.00 }
        ];
        // ==============================================================

        let carrello = {};
        let container = document.getElementById("lista-prodotti");
        let categoriaAttuale = "";

        // Motore di rendering: legge il listino e crea la pagina
        listino.forEach((item, index) => {
            // Se la categoria cambia, stampa il titoletto della nuova categoria
            if (item.categoria !== categoriaAttuale) {
                container.innerHTML += `<h3 class="categoria">${item.categoria}</h3>`;
                categoriaAttuale = item.categoria;
            }

            // Stampa il prodotto
            container.innerHTML += `
                <div class="prodotto">
                    <div class="info">
                        <h3>${item.nome}</h3>
                        <p>€ ${item.prezzo.toFixed(2)}</p>
                    </div>
                    <div class="controlli">
                        <button onclick="modifica(${index}, -1)">-</button>
                        <span class="qta" id="qta-${index}">0</span>
                        <button onclick="modifica(${index}, 1)">+</button>
                    </div>
                </div>
            `;
        });

        // Logica di aggiunta/rimozione dal carrello
        function modifica(index, valore) {
            let nomeProdotto = listino[index].nome;
            
            if (!carrello[nomeProdotto]) carrello[nomeProdotto] = 0;
            carrello[nomeProdotto] += valore;
            if (carrello[nomeProdotto] < 0) carrello[nomeProdotto] = 0;
            
            document.getElementById('qta-' + index).innerText = carrello[nomeProdotto];
            calcolaTotale();
        }

        // Calcolo totale ed elaborazione scontrino
        function calcolaTotale() {
            let totalePezzi = 0;
            let totaleEuro = 0;
            let stringaOrdine = "";
            
            for (let item in carrello) {
                if (carrello[item] > 0) {
                    totalePezzi += carrello[item];
                    
                    // Cerca il prodotto per calcolarne il costo totale
                    let prodottoObj = listino.find(p => p.nome === item);
                    if(prodottoObj) totaleEuro += (carrello[item] * prodottoObj.prezzo);

                    // Crea la stringa testuale per la stampante termica
                    stringaOrdine += `${carrello[item]}x ${item}, `; 
                }
            }

            // Aggiorna il pulsante di Telegram
            if (totalePezzi > 0) {
                tg.MainButton.setText(`INVIA ORDINE (€ ${totaleEuro.toFixed(2)})`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }

            // Rimuove l'ultima virgola dalla stringa
            window.ordineFinale = stringaOrdine.slice(0, -2);
        }

        // Click finale
        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            tg.sendData(window.ordineFinale);
            tg.close();
        });
    </script>
</body>
</html>
