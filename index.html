<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar Istituto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); padding: 15px; padding-bottom: 80px; margin: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        .sezione-dati { background: var(--tg-theme-secondary-bg-color, #f0f0f0); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .categoria { font-size: 18px; margin-top: 25px; margin-bottom: 10px; border-bottom: 2px solid #007aff; padding-bottom: 5px; }
        .prodotto { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); border-radius: 12px; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .info p { margin: 0; color: #888; font-size: 14px; }
        .controlli { display: flex; align-items: center; gap: 10px; }
        button.btn-qta { background: #007aff; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .qta { font-weight: bold; width: 20px; text-align: center; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-top: 0;">Menu Bar</h2>
    
    <div class="sezione-dati">
        <div class="form-group">
            <label for="classe">Classe / Ufficio:</label>
            <input type="text" id="classe" placeholder="es. Ufficio Tecnico o 3A Info">
        </div>
        <div class="form-group">
            <label for="note">Note:</label>
            <textarea id="note" rows="2" placeholder="Note per la preparazione..."></textarea>
        </div>
    </div>
    
    <div id="lista-prodotti"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.color = "#31b545";

        const listino = [
            { categoria: "Listino", nome: "Panino Prosciutto crudo", prezzo: 1.5 },
            { categoria: "Listino", nome: "Panino Prosciutto crudo e formaggio", prezzo: 1.5 },

            { categoria: "Listino", nome: "Panino Prosciutto cotto e formaggio", prezzo: 1.5 },
            { categoria: "Listino", nome: "Panino Mortadella", prezzo: 1.5 },
            { categoria: "Listino", nome: "Cornetti vari", prezzo: 1.2 },
            { categoria: "Listino", nome: "Cornetti integrale", prezzo: 1.5 },
            { categoria: "Listino", nome: "Conchiglia", prezzo: 1.2 },
            { categoria: "Listino", nome: "Hot dog surgelato", prezzo: 2 },
            { categoria: "Listino", nome: "Panino napoletano surgelato", prezzo: 2 },
            { categoria: "Listino", nome: "Calzone mozzarella e pomodoro surgelato", prezzo: 2.2 },
            { categoria: "Listino", nome: "Caffè", prezzo: 1 },
            { categoria: "Listino", nome: "Cappuccino", prezzo: 1.2 },
            { categoria: "Listino", nome: "Camomilla", prezzo: 0.8 },
            { categoria: "Listino", nome: "Ginseng", prezzo: 1 },
            { categoria: "Listino", nome: "Caffè orzo", prezzo: 1 },
            { categoria: "Listino", nome: "Tè caldo", prezzo: 0.8 },
            { categoria: "Listino", nome: "Tisane", prezzo: 0.8 },
            { categoria: "Listino", nome: "Acqua naturale 50cl", prezzo: 0.5 },
            { categoria: "Listino", nome: "Acqua gassata 50cl", prezzo: 0.5 },
            { categoria: "Listino", nome: "Coca Cola 33cl", prezzo: 1.5 },
            { categoria: "Listino", nome: "Pepsi 33cl", prezzo: 1 },
            { categoria: "Listino", nome: "Estathé pesca o limone 33cl", prezzo: 1.5 },
            { categoria: "Listino", nome: "Fanta aranciata 33cl", prezzo: 1.2 },
            { categoria: "Listino", nome: "Succo di frutta Brik pesca o ace o albicocca 200 ml", prezzo: 0.7 },
            { categoria: "Listino", nome: "San Ben. succoso varie gusti 40 cl", prezzo: 1.2 },
            { categoria: "Listino", nome: "Energade", prezzo: 1.2 },
            { categoria: "Listino", nome: "Kinder Bueno classico o white", prezzo: 1.8 },
            { categoria: "Listino", nome: "Kinder Cereali", prezzo: 1 },
            { categoria: "Listino", nome: "Kit Kat classico o dark", prezzo: 1.2 },
            { categoria: "Listino", nome: "Lion", prezzo: 1.2 },
            { categoria: "Listino", nome: "Twix", prezzo: 1.2 },
            { categoria: "Listino", nome: "Bounty", prezzo: 1.2 },
            { categoria: "Listino", nome: "Mars", prezzo: 1.2 },
            { categoria: "Listino", nome: "Snickers", prezzo: 1.2 },
            { categoria: "Listino", nome: "Barretta Milka varie gusti", prezzo: 1.3 },
            { categoria: "Listino", nome: "M & M varie gusti", prezzo: 1.2 },
            { categoria: "Listino", nome: "Pic Nic 50gr", prezzo: 1.2 },
            { categoria: "Listino", nome: "Nic Nac’s 125 gr", prezzo: 3 },
            { categoria: "Listino", nome: "Ringo cacao o vaniglia 55gr", prezzo: 1 },
            { categoria: "Listino", nome: "Baiocchi cacao o pistacchio 28gr", prezzo: 0.8 },
            { categoria: "Listino", nome: "Pavesini monodose", prezzo: 0.8 },
            { categoria: "Listino", nome: "Wafer varie gusti 45gr", prezzo: 1 },
            { categoria: "Listino", nome: "Biscotti Lotus 250gr", prezzo: 2.5 },
            { categoria: "Listino", nome: "Biscotti Oreo 66 gr", prezzo: 1.2 },
            { categoria: "Listino", nome: "Crackers TUC 31 gr", prezzo: 0.5 },
            { categoria: "Listino", nome: "Croccantelle pizza o bacon o pizza", prezzo: 0.5 },
            { categoria: "Listino", nome: "Krit tubo 100 gr", prezzo: 1.2 },
            { categoria: "Listino", nome: "Crackers Granpavesi", prezzo: 0.5 },
            { categoria: "Listino", nome: "Patatine San Carlo varie gusti", prezzo: 1.5 },
            { categoria: "Listino", nome: "Patatine Amica varie gusti", prezzo: 1.5 },
            { categoria: "Listino", nome: "Fonzies 40 gr", prezzo: 1.5 },
            { categoria: "Listino", nome: "Gomme Air Action", prezzo: 1.2 },
            { categoria: "Listino", nome: "Gomme Vigorsol con zucchero e senza", prezzo: 1.2 },
            { categoria: "Listino", nome: "Gomme Vigorsol frutta", prezzo: 1.2 },
            { categoria: "Listino", nome: "Gomme Air Action monoporzione", prezzo: 0.2 },
            { categoria: "Listino", nome: "Fruit Joy", prezzo: 1.2 },
            { categoria: "Listino", nome: "Golia Activ Plus", prezzo: 1.7 },
            { categoria: "Listino", nome: "Goleador", prezzo: 0.2 },
            { categoria: "Listino", nome: "Caramelle gommose hamburger", prezzo: 0.4 },
            { categoria: "Listino", nome: "Lupo Alberto", prezzo: 0.2 },
            { categoria: "Listino", nome: "Halls varie gusti", prezzo: 1 },
            { categoria: "Listino", nome: "Hot Dog Trolly caramelle gommose", prezzo: 0.5 }
        ];

        let carrello = {};
        let container = document.getElementById("lista-prodotti");
        let categoriaAttuale = "";

        listino.forEach((item, index) => {
            if (item.categoria !== categoriaAttuale) {
                container.innerHTML += `<h3 class="categoria">${item.categoria}</h3>`;
                categoriaAttuale = item.categoria;
            }
            container.innerHTML += `
                <div class="prodotto">
                    <div class="info">
                        <h3>${item.nome}</h3>
                        <p>€ ${item.prezzo.toFixed(2)}</p>
                    </div>
                    <div class="controlli">
                        <button class="btn-qta" onclick="modifica(${index}, -1)">-</button>
                        <span class="qta" id="qta-${index}">0</span>
                        <button class="btn-qta" onclick="modifica(${index}, 1)">+</button>
                    </div>
                </div>
            `;
        });

        let totaleEuro = 0;
        let arrayCarrello = [];

        function modifica(index, valore) {
            let nomeProdotto = listino[index].nome;
            if (!carrello[nomeProdotto]) carrello[nomeProdotto] = 0;
            carrello[nomeProdotto] += valore;
            if (carrello[nomeProdotto] < 0) carrello[nomeProdotto] = 0;
            
            document.getElementById('qta-' + index).innerText = carrello[nomeProdotto];
            calcolaTotale();
        }

        function calcolaTotale() {
            let totalePezzi = 0;
            totaleEuro = 0;
            arrayCarrello = [];
            
            for (let item in carrello) {
                if (carrello[item] > 0) {
                    totalePezzi += carrello[item];
                    let prodottoObj = listino.find(p => p.nome === item);
                    if(prodottoObj) {
                        let totaleRiga = carrello[item] * prodottoObj.prezzo;
                        totaleEuro += totaleRiga;
                        arrayCarrello.push({
                            nome: item,
                            prezzo: prodottoObj.prezzo,
                            qta: carrello[item],
                            totale_riga: totaleRiga
                        });
                    }
                }
            }

            if (totalePezzi > 0) {
                tg.MainButton.setText(`INVIA ORDINE (€ ${totaleEuro.toFixed(2)})`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            // Pacchetto JSON senza l'email
            let payload = {
                classe: document.getElementById('classe').value,
                note: document.getElementById('note').value,
                prodotti: arrayCarrello,
                totale_generale: totaleEuro
            };
            tg.sendData(JSON.stringify(payload));
            tg.close();
        });
    </script>
</body>
</html>
